automation:
  methods:
    - method: "autonomous"
      models: ["Antigravity (Google DeepMind)"]
      framework: "Antigravity agentic IDE"
      tool_setup: >-
        Autonomous agent session given the high-level goal of finding and
        formally verifying a proof or refutation of an open conjecture in
        Lean 4. The agent scouted open conjectures from Written on the Wall II,
        verified novelty across public registries and repositories, discovered
        the Chvátal extremal non-edge + complement-degree proof, wrote the
        standalone Lean 4 formalization from scratch with zero dependencies,
        and wrote an independent Python exhaustive verifier (verify.py) over
        225,915 graphs (n = 2..7).
      cost:
        wall_time: "about 1 hour elapsed"
        spend_usd: "subscription-based"
        hardware: "local macOS ARM64 machine"
      prompting_notes: >-
        High-level user request for an open conjecture proof/refutation
        formally verified in Lean 4 without human mathematical intervention.
  spend_usd: "subscription-based"
  notes: >-
    The human author did not write proof code or manually verify the informal
    proof; mathematical correctness rests on Lean 4's kernel verification,
    Comparator verification against Challenge.lean, and the independent
    exhaustive Python check.

fidelity:
  divergences: >-
    None known in mathematical content. Rather than using real/rational
    division, the statement clears denominators exactly over Nat:
    (1/2) * (1 + (2/3) * e) ≤ μ is algebraically equivalent over Nat to
    3 + 2 * e ≤ 6 * μ (and by parity to e + 2 ≤ 3 * μ). Every graph on n
    vertices is represented up to relabeling as a SimpleGraph on Fin n with
    decidable Boolean adjacency.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Verified locally with Lean 4.36.0 (`lake build`, 0 errors, 0 warnings,
    0 sorry, 0 native_decide, standard axioms only) and cross-checked on all
    27,475 labeled connected graphs for n = 2..6 and all 198,440 graphs with
    |E(Ḡ)| ≤ 7 for n = 7 in verify.py. Informal proof in PROOF.md has not
    been human peer-reviewed.

