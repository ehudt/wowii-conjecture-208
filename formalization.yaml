version: "v0.4"

project:
  name: "Written on the Wall II, Conjecture 208: A complement-edge and matching condition for Hamiltonian paths"
  description: >-
    A self-contained, zero-dependency Lean 4 proof of Conjecture 208 from
    Ermelinda DeLaViña's "Written on the Wall II" (conjectures of Graffiti.pc,
    announced January 12, 2006): for every finite simple connected graph G on
    n > 1 vertices, if (1/2) * (1 + (2/3) * |E(Ḡ)|) ≤ μ(G) — equivalently
    3 + 2 * |E(Ḡ)| ≤ 6 * μ(G) or |E(Ḡ)| + 2 ≤ 3 * μ(G), where Ḡ is the
    complement of G and μ(G) is the matching number — then G has a Hamiltonian
    path. Using only Lean 4 core (no Mathlib or external dependencies), the
    formalization proves the base cases n = 2, 3, passes by strong induction on
    |E(Ḡ)| to an edge-maximal non-traceable supergraph, establishes Chvátal's
    extremal non-edge lemma via the universal-vertex extension G+ = G + v* and
    Pósa flipping, sums complement degrees to obtain 2|E(Ḡ)| ≥ i(2n + 1 - 3i),
    eliminates all odd n ≥ 5 and all even n ≥ 10 by a quadratic dichotomy, and
    resolves the four remaining finite pairs (n, i) ∈ {(4, 2), (6, 2), (6, 3),
    (8, 4)} using matching size and explicit 6-vertex Hamiltonian paths.
  authors:
    - "Ehud Tamir"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ehud Tamir"

