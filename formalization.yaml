    Full proof of Written on the Wall II Conjecture 208 for all finite simple
    connected graphs on n > 1 vertices represented on Fin n, stated in exact
    denominator-cleared natural number form 3 + 2 * |E(Ḡ)| ≤ 6 * μ(G), in
    equivalent integer form |E(Ḡ)| + 2 ≤ 3 * μ(G), and in direct existential
    matching form, together with matchingNumber_spec certifying exactness of
